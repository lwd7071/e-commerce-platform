name: Backend CI Quality Gates

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Gate 1 - Lint
        run: npm run lint

      - name: Gate 2 - Typecheck
        run: npm run typecheck

      - name: Gate 3 - Build
        run: npm run build

      - name: Gate 4 - Tests
        run: npm test
