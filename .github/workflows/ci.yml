name: Repository Quality Gates

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      RUN_REMOTE_DB_TESTS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.12.1

      - name: Verify runtime
        run: |
          test "$(node --version)" = "v22.20.0"
          test "$(npm --version)" = "11.12.1"

      - name: Install backend dependencies
        run: npm ci

      - name: Verify backend lockfile is clean
        run: git diff --exit-code -- package-lock.json

      - name: Prisma validate
        run: npx prisma validate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Native tests
        run: npm run test:node

      - name: Vitest tests
        run: npm run test:vitest

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: ecommerce-web/package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.12.1

      - name: Verify runtime
        run: |
          test "$(node --version)" = "v22.20.0"
          test "$(npm --version)" = "11.12.1"

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend lockfile is clean
        run: git diff --exit-code -- package-lock.json

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  remote-db:
    name: Remote database quality
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    needs: backend-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      DATABASE_URL: ${{ secrets.SUPABASE_TEST_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.SUPABASE_TEST_DIRECT_URL }}
      DATABASE_ENVIRONMENT: test
      RUN_REMOTE_DB_TESTS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required remote database secrets exist
        run: |
          test -n "$SUPABASE_URL"
          test -n "$DATABASE_URL"
          test -n "$DIRECT_URL"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.12.1

      - name: Verify runtime
        run: |
          test "$(node --version)" = "v22.20.0"
          test "$(npm --version)" = "11.12.1"

      - name: Install backend dependencies
        run: npm ci

      - name: Verify backend lockfile is clean
        run: git diff --exit-code -- package-lock.json

      - name: Run remote DB suite with zero skipped tests
        run: |
          npx vitest run tests/db --testTimeout=30000 --hookTimeout=45000 --reporter=json --outputFile=remote-db-results.json
          test "$(jq -r '.numSkipped' remote-db-results.json)" = "0"
