services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ecommerce-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PORT=3001
      - CORS_ALLOWED_ORIGINS=https://dinoshopping.io.vn,http://localhost:3000,http://127.0.0.1:3000

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.dinoshopping.io.vn/api/v1
        NEXT_PUBLIC_SITE_URL: https://dinoshopping.io.vn
        NEXT_PUBLIC_SUPABASE_URL: https://putywqmxtjttfdezlswf.supabase.co
        NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ZXw4cszWPlXI7v_jWHQdjg_QkGXa7mt
        NEXT_PUBLIC_USE_MOCK: "false"
    container_name: ecommerce-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      - backend

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
      - backend
